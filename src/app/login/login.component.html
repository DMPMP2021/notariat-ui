<div class="login-container">
    <form class="login-card" (ngSubmit)="go()">
  
      <!-- Logo et titre -->
      <div class="logo-section">
        <img *ngIf="logoOk" class="logo" [src]="logoSrc" alt="Logo DGI" (error)="logoOk = false">
        
        <h2>Connexion</h2>
        <p class="subtitle">Espace Notaire, Inspecteur et Receveur.</p>
      </div>
  
      <!-- Formulaire -->
      <div class="login-form">
        <div class="field">
          <label for="u">Identifiant</label>
          <input id="u" name="u" class="full-width" [(ngModel)]="u" required autocomplete="username">
        </div>
  
        <div class="field">
          <label for="p">Mot de passe</label>
          <input id="p" name="p" type="password" class="full-width" [(ngModel)]="p" required autocomplete="current-password">
        </div>
  
        <p class="error" *ngIf="err" role="alert">{{ err }}</p>
  
        <button type="submit" class="login-btn full-width" [disabled]="busy || !u || !p">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
          </svg>
          Se connecter
        </button>
      </div>
  
      <!-- Footer -->
      <p class="footer-text">Gestion des actes notariés © {{ annee }}</p>
    </form>
  </div>
